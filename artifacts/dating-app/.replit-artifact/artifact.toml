kind = "web"
previewPath = "/"
title = "Spark Dating App"
description = "A full-stack demo dating web app inspired by modern swipe-based platforms. Features demo login (Gmail/Instagram simulation), swipeable profile cards with like/pass/super-like, match detection, and a personal profile page. Seeded with 12 demo users."
version = "1.0.0"
id = "artifacts/dating-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25129

[services.development]
run = "pnpm --filter @workspace/dating-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dating-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/dating-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25129"
BASE_PATH = "/"
